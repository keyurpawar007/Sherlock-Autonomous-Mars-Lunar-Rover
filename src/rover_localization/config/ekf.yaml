ekf_filter_node_local:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /odom
    odom0_config: [true,  true,  false,
                  false, false, true,
                  true,  false, false,
                  false, false, true,
                  false, false, false]
    odom0_differential: false

    imu0: /sensors/imu
    imu0_config: [false, false, false,
                 false, false, true,
                 false, false, false,
                 false, false, true,
                 true,  false, false]
    imu0_differential: false

ekf_filter_node_global:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    odom0: /odom
    odom0_config: [true,  true,  false,
                  false, false, true,
                  true,  false, false,
                  false, false, true,
                  false, false, false]

    imu0: /sensors/imu
    imu0_config: [false, false, false,
                 false, false, true,
                 false, false, false,
                 false, false, true,
                 true,  false, false]

    odom1: /odometry/gps
    odom1_config: [true,  true,  false,
                  false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    odom1_differential: false
