---
rtabmap:
  ros__parameters:
    # ===== FRAME CONFIGURATION =====
    frame_id: "camera_link"
    map_frame_id: "map"
    odom_frame_id: "odom"
    publish_tf: true

    # ===== INPUT TOPICS - D435 SPECIFIC =====
    subscribe_depth: true
    subscribe_rgb: true
    subscribe_odom_info: true

    # CRITICAL: Use aligned depth topic for pixel-perfect matching
    rgb_topic: "/camera/color/image_raw"
    depth_topic: "/camera/aligned_depth_to_color/image_raw"
    camera_info_topic: "/camera/color/camera_info"

    odom_topic: "/odom"

    # ===== DATA SYNC =====
    approx_sync: true
    queue_size: 10

    # ===== MAP SETTINGS - D435 OPTIMIZED =====
    grid/fromDepth: true
    grid/3d: false
    grid/cellSize: 0.05
    grid/maxGroundHeight: 0.1
    grid/maxObstacleHeight: 2.0
    grid/rangeMax: 3.0

    # ===== LOOP CLOSURE =====
    Kp/ProximityBySpace: true
    Kp/MaxFeatures: 500
    Kp/DetectorStrategy: 0

    # ===== GRAPH OPTIMIZATION =====
    Optimizer/Strategy: 1
    Optimizer/GravitySigma: 0.3
    Optimizer/Iterations: 5
    Optimizer/FromGraphEnd: true

    # ===== MEMORY =====
    Mem/RehearsalSimilarity: 0.6
    Mem/BadSignaturesRatio: 0.3
    Mem/STMSize: 30

    # ===== MODE =====
    localization: false

    # ===== DATABASE =====
    db_path: "~/ros2_ws/rtabmap.db"

    # ===== VISUALIZATION =====
    publish_grid: true
    publish_odom: true
    publish_path: true
